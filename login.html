<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Acceso — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --brand: #ff6b00;
  --brand2: #e05a00;
  --brand-bg: rgba(255,107,0,.12);
  --brand-bd: rgba(255,107,0,.35);
  --dark:  #0d0d0d;
  --dark2: #161616;
  --dark3: #1e1e1e;
  --dark4: #252525;
  --white: #fff;
  --muted: rgba(255,255,255,.38);
  --muted2: rgba(255,255,255,.55);
  --border: rgba(255,255,255,.1);
  --border2: rgba(255,255,255,.18);
  --ok: #4caf50;
  --danger: #ef5350;
  --r: 14px;
  --rs: 10px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--dark);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(255,107,0,.07) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(255,107,0,.05) 0%, transparent 50%);
}

.login-wrap {
  width: 100%;
  max-width: 420px;
  animation: fadeIn .4s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.brand-header {
  text-align: center;
  margin-bottom: 28px;
}
.brand-icon {
  width: 64px; height: 64px;
  background: var(--brand-bg);
  border: 1.5px solid var(--brand-bd);
  border-radius: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  margin-bottom: 14px;
}
.brand-name {
  font-family: 'Montserrat', sans-serif;
  font-size: 28px; font-weight: 900;
  color: var(--white);
  letter-spacing: -1px;
  margin-bottom: 4px;
}
.brand-sub {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}

.card {
  background: var(--dark2);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 32px 28px;
  box-shadow: 0 24px 64px rgba(0,0,0,.5);
}

.panel-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 17px; font-weight: 800;
  color: var(--white);
  margin-bottom: 22px;
  display: flex; align-items: center; gap: 8px;
}
.panel-title .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--brand);
  flex-shrink: 0;
}

.field-group { margin-bottom: 14px; }
.field-label {
  display: block;
  font-size: 11px; font-weight: 700;
  color: var(--muted2);
  text-transform: uppercase;
  letter-spacing: .6px;
  margin-bottom: 7px;
}
.field-input {
  width: 100%;
  padding: 13px 16px;
  background: var(--dark3);
  border: 1.5px solid var(--border);
  border-radius: var(--rs);
  font-family: inherit;
  font-size: 14px;
  color: var(--white);
  transition: border-color .2s, background .2s;
}
.field-input:focus { outline: none; border-color: var(--brand); background: var(--dark4); }
.field-input::placeholder { color: var(--muted); }
.field-input.error { border-color: var(--danger) !important; }

.pass-req { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.5; }

.btn-main {
  width: 100%; padding: 14px;
  background: var(--brand); color: var(--white);
  border: none; border-radius: var(--rs);
  font-family: inherit; font-size: 15px; font-weight: 800;
  cursor: pointer;
  transition: background .15s, transform .1s;
  margin-top: 6px; letter-spacing: .2px;
}
.btn-main:hover  { background: var(--brand2); }
.btn-main:active { transform: scale(.98); }
.btn-main:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.btn-back {
  background: none; border: none;
  color: var(--muted2);
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer; padding: 0;
  display: inline-flex; align-items: center; gap: 5px;
  transition: color .15s;
  margin-bottom: 20px;
}
.btn-back:hover { color: var(--white); }

.forgot-link {
  display: block; text-align: right;
  font-size: 12px; color: var(--muted2); font-weight: 600;
  cursor: pointer;
  margin-top: -6px; margin-bottom: 18px;
  transition: color .15s;
}
.forgot-link:hover { color: var(--brand); }

.msg {
  padding: 11px 14px; border-radius: var(--rs);
  font-size: 13px; font-weight: 600;
  margin-top: 14px; display: none; line-height: 1.5;
}
.msg.show    { display: block; }
.msg.error   { background: rgba(239,83,80,.12);  color: #ef9090;  border: 1px solid rgba(239,83,80,.25); }
.msg.success { background: rgba(76,175,80,.12);  color: #81c784;  border: 1px solid rgba(76,175,80,.25); }
.msg.info    { background: rgba(255,107,0,.1);   color: #ffb380;  border: 1px solid var(--brand-bd); }

.spinner-wrap {
  display: none; align-items: center; gap: 8px;
  font-size: 13px; color: var(--muted); margin-top: 12px;
}
.spinner-wrap.show { display: flex; }
.spin {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,107,0,.2);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin .7s linear infinite; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

.divider { height: 1px; background: var(--border); margin: 22px 0; }

.footer-txt {
  text-align: center; font-size: 11px;
  color: var(--muted); margin-top: 20px; line-height: 1.6;
}

.panel { display: none; }
.panel.active { display: block; }

@media (max-width: 480px) {
  .card { padding: 24px 18px; }
  .brand-name { font-size: 24px; }
}
</style>
</head>
<body>

<div class="login-wrap">

  <div class="brand-header">
    <div class="brand-icon">🛵</div>
    <div class="brand-name" id="brand-nombre">Admin</div>
    <div class="brand-sub">Panel de gestión de domicilios</div>
  </div>

  <div class="card">

    <!-- PANEL 1: LOGIN -->
    <div id="panel-login" class="panel active">
      <div class="panel-title"><div class="dot"></div> Iniciar sesión</div>

      <div class="field-group">
        <label class="field-label" for="login-email">Correo electrónico</label>
        <input class="field-input" id="login-email" type="email"
          placeholder="tu@correo.com" autocomplete="username"
          onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()">
      </div>

      <div class="field-group">
        <label class="field-label" for="login-pass">Contraseña</label>
        <input class="field-input" id="login-pass" type="password"
          placeholder="••••••••" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()">
      </div>

      <span class="forgot-link" onclick="showPanel('panel-recovery')">
        ¿Olvidaste tu contraseña?
      </span>

      <button class="btn-main" id="btn-login" onclick="doLogin()">Entrar →</button>
      <div class="spinner-wrap" id="spin-login"><div class="spin"></div>Verificando...</div>
      <div class="msg" id="msg-login"></div>
    </div>

    <!-- PANEL 2: RECUPERAR CONTRASEÑA -->
    <div id="panel-recovery" class="panel">
      <button class="btn-back" onclick="showPanel('panel-login')">← Volver al login</button>
      <div class="panel-title"><div class="dot"></div> Recuperar contraseña</div>

      <div class="field-group">
        <label class="field-label" for="rec-email">Tu correo electrónico</label>
        <input class="field-input" id="rec-email" type="email"
          placeholder="tu@correo.com" autocomplete="email"
          onkeydown="if(event.key==='Enter')doRecovery()">
      </div>

      <button class="btn-main" id="btn-recovery" onclick="doRecovery()">
        Enviar enlace de recuperación
      </button>
      <div class="spinner-wrap" id="spin-recovery"><div class="spin"></div>Enviando correo...</div>
      <div class="msg" id="msg-recovery"></div>
    </div>

    <!-- PANEL 3: NUEVA CONTRASEÑA -->
    <div id="panel-newpass" class="panel">
      <div class="panel-title"><div class="dot"></div> Crea tu nueva contraseña</div>

      <div class="field-group">
        <label class="field-label" for="np-pass">Nueva contraseña</label>
        <input class="field-input" id="np-pass" type="password"
          placeholder="Mínimo 8 caracteres" autocomplete="new-password"
          onkeydown="if(event.key==='Enter')document.getElementById('np-pass2').focus()">
        <div class="pass-req">Mínimo 8 caracteres</div>
      </div>

      <div class="field-group">
        <label class="field-label" for="np-pass2">Confirmar contraseña</label>
        <input class="field-input" id="np-pass2" type="password"
          placeholder="Repite la contraseña" autocomplete="new-password"
          onkeydown="if(event.key==='Enter')doNewPass()">
      </div>

      <button class="btn-main" id="btn-newpass" onclick="doNewPass()">
        Guardar nueva contraseña
      </button>
      <div class="spinner-wrap" id="spin-newpass"><div class="spin"></div>Actualizando...</div>
      <div class="msg" id="msg-newpass"></div>
    </div>

  </div>

  <div class="footer-txt">
    Sistema de gestión de domicilios &copy; 2025
  </div>
</div>

<script>
'use strict';

// ── CREDENCIALES SUPABASE ──────────────────────────────────────
const SUPABASE_URL = 'https://ramgdkqowllcmenxzwhn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhbWdka3Fvd2xsY21lbnh6d2huIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NzMxNTksImV4cCI6MjA5MzA0OTE1OX0.cQpAlUYheb1RMm-KwSeX0Q1W6lO6GtlCMT6PX5vkz-I';
// URL donde viven los archivos — ajusta si cambias de dominio
const SITE_URL = window.location.origin;

// ── UI HELPERS ─────────────────────────────────────────────────
function showPanel(id) {
  document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
  var el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function setMsg(panelId, txt, type) {
  var el = document.getElementById('msg-' + panelId);
  if (!el) return;
  el.textContent = txt;
  el.className   = 'msg ' + (txt ? 'show ' + (type || 'error') : '');
}

function setLoading(panelId, on) {
  var btn  = document.getElementById('btn-'  + panelId);
  var spin = document.getElementById('spin-' + panelId);
  if (btn)  btn.disabled = on;
  if (spin) spin.classList.toggle('show', on);
}

// ── FETCH A SUPABASE AUTH ──────────────────────────────────────
async function authFetch(endpoint, body, accessToken) {
  var headers = { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY };
  if (accessToken) headers['Authorization'] = 'Bearer ' + accessToken;
  var r = await fetch(SUPABASE_URL + '/auth/v1/' + endpoint, {
    method: 'POST', headers: headers, body: JSON.stringify(body)
  });
  var data = await r.json();
  if (!r.ok) throw new Error(data.error_description || data.msg || data.error || 'Error de autenticación');
  return data;
}

// ── CARGAR NOMBRE DEL LOCAL ────────────────────────────────────
(async function cargarNombre() {
  try {
    var r = await fetch(SUPABASE_URL + '/rest/v1/configuracion?select=nombre_local&limit=1', {
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' }
    });
    if (r.ok) {
      var d = await r.json();
      if (d && d[0] && d[0].nombre_local) {
        document.getElementById('brand-nombre').textContent = d[0].nombre_local;
        document.title = 'Acceso — ' + d[0].nombre_local;
      }
    }
  } catch(e) {}
})();

// ── DETECCIÓN DE HASH RECOVERY ─────────────────────────────────
var _recoveryToken = null;

function detectarHashRecovery() {
  var hash = window.location.hash;
  if (!hash) return false;
  var params = {};
  hash.replace(/^#/, '').split('&').forEach(function(part) {
    var eq = part.indexOf('=');
    if (eq < 0) return;
    params[decodeURIComponent(part.slice(0, eq))] = decodeURIComponent(part.slice(eq + 1));
  });
  if ((params.type === 'recovery' || !params.type) && params.access_token) {
    _recoveryToken = params.access_token;
    history.replaceState(null, '', window.location.pathname);
    showPanel('panel-newpass');
    return true;
  }
  return false;
}

// ── LOGIN ──────────────────────────────────────────────────────
async function doLogin() {
  var email = (document.getElementById('login-email') || {}).value || '';
  var pass  = (document.getElementById('login-pass')  || {}).value || '';

  setMsg('login', '');
  if (!email || !pass) { setMsg('login', 'Ingresa tu correo y contraseña.', 'error'); return; }

  setLoading('login', true);
  try {
    var data = await authFetch('token?grant_type=password', {
      email: email.trim(), password: pass
    });
    if (!data.access_token) throw new Error('Respuesta inesperada del servidor');

    // Guardar sesión
    var session = {
      access_token:  data.access_token,
      refresh_token: data.refresh_token,
      expires_at:    Date.now() + (data.expires_in || 86400) * 1000,
      user:          data.user || {}
    };
    try { localStorage.setItem('papayaso_admin_session', JSON.stringify(session)); } catch(e) {}
    try { sessionStorage.removeItem('papayaso_logout_flag'); } catch(e) {}

    // Redirigir al admin
    window.location.replace('admin.html');

  } catch(e) {
    var msg = e.message;
    if (msg.includes('Invalid') || msg.includes('invalid') || msg.includes('credentials')) {
      msg = 'Correo o contraseña incorrectos.';
    } else if (msg.includes('Email not confirmed')) {
      msg = 'Confirma tu correo primero. Revisa tu bandeja de entrada.';
    }
    setMsg('login', msg, 'error');
    setLoading('login', false);
    var passEl = document.getElementById('login-pass');
    if (passEl) { passEl.value = ''; passEl.focus(); }
  }
}

// ── RECUPERAR CONTRASEÑA ───────────────────────────────────────
async function doRecovery() {
  var email = (document.getElementById('rec-email') || {}).value || '';
  setMsg('recovery', '');
  if (!email) { setMsg('recovery', 'Ingresa tu correo electrónico.', 'error'); return; }

  setLoading('recovery', true);
  try {
    await authFetch('recover', {
      email: email.trim(),
      gotrue_meta_security: {},
      // Redirigir al login para que detecte el hash de recovery
      redirect_to: SITE_URL + '/login.html'
    });
    setMsg('recovery',
      '✅ Correo enviado. Revisa tu bandeja de entrada (y spam). El enlace es válido por 1 hora.',
      'success');
  } catch(e) {
    // Supabase retorna 200 incluso si el correo no existe (seguridad)
    setMsg('recovery',
      '✅ Si ese correo existe, recibirás el enlace en breve.',
      'success');
  } finally {
    setLoading('recovery', false);
  }
}

// ── NUEVA CONTRASEÑA ───────────────────────────────────────────
async function doNewPass() {
  var pass1 = (document.getElementById('np-pass')  || {}).value || '';
  var pass2 = (document.getElementById('np-pass2') || {}).value || '';
  setMsg('newpass', '');

  if (!pass1 || pass1.length < 8) {
    setMsg('newpass', 'La contraseña debe tener al menos 8 caracteres.', 'error');
    document.getElementById('np-pass').classList.add('error');
    return;
  }
  if (pass1 !== pass2) {
    setMsg('newpass', 'Las contraseñas no coinciden.', 'error');
    document.getElementById('np-pass2').classList.add('error');
    return;
  }
  if (!_recoveryToken) {
    setMsg('newpass', 'Token no encontrado. Solicita un nuevo enlace de recuperación.', 'error');
    return;
  }
  ['np-pass','np-pass2'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.classList.remove('error');
  });

  setLoading('newpass', true);
  try {
    var r = await fetch(SUPABASE_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: {
        'Content-Type':  'application/json',
        'apikey':        SUPABASE_KEY,
        'Authorization': 'Bearer ' + _recoveryToken
      },
      body: JSON.stringify({ password: pass1 })
    });
    var d = await r.json();
    if (!r.ok) throw new Error(d.error_description || d.msg || d.error || 'Error al actualizar');

    _recoveryToken = null;
    setMsg('newpass', '✅ Contraseña actualizada. Ahora puedes iniciar sesión.', 'success');
    document.getElementById('np-pass').value  = '';
    document.getElementById('np-pass2').value = '';
    setTimeout(function() {
      showPanel('panel-login');
      setMsg('login', 'Contraseña actualizada. Inicia sesión con tu nueva clave.', 'info');
    }, 2200);
  } catch(e) {
    var msg = e.message;
    if (msg.includes('expired') || msg.includes('invalid')) {
      msg = 'El enlace de recuperación expiró. Solicita uno nuevo.';
    }
    setMsg('newpass', msg, 'error');
  } finally {
    setLoading('newpass', false);
  }
}

// ── ARRANQUE: verificar sesión activa ─────────────────────────
(async function init() {
  // 1. Detectar hash de recuperación
  if (detectarHashRecovery()) return;

  // 2. Si venimos de un logout, no auto-redirigir
  var logoutFlag = false;
  try {
    logoutFlag = !!sessionStorage.getItem('papayaso_logout_flag');
    if (logoutFlag) {
      sessionStorage.removeItem('papayaso_logout_flag');
      try { localStorage.removeItem('papayaso_admin_session'); } catch(e) {}
    }
  } catch(e) {}
  if (logoutFlag) {
    setTimeout(function() {
      var el = document.getElementById('login-email');
      if (el) el.focus();
    }, 100);
    return;
  }

  // 3. Verificar sesión guardada
  try {
    var raw = localStorage.getItem('papayaso_admin_session');
    if (raw) {
      var session = JSON.parse(raw);
      if (session && session.access_token) {
        // Normalizar expires_at — puede estar en segundos o milisegundos
        var expMs = session.expires_at > 1e12
          ? session.expires_at
          : session.expires_at * 1000;
        if (Date.now() < expMs) {
          // Sesión válida → ir directo al admin
          window.location.replace('admin.html');
          return;
        }
      }
      // Expirada → limpiar
      localStorage.removeItem('papayaso_admin_session');
    }
  } catch(e) {}

  // 4. Sin sesión → mostrar login
  setTimeout(function() {
    var el = document.getElementById('login-email');
    if (el) el.focus();
  }, 100);
})();
</script>
</body>
</html>
